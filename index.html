<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ArtMorph Cam - アートフィルターカメラ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* モバイル向けのスムーズなスクロールとタップハイライト無効化 */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
    }
    /* スクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* スライダー装飾 */
    input[type=range] {
      accent-color: #38bdf8;
    }
    /* モード切り替えのアニメーション */
    .filter-btn.active {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between bg-black text-white">

  <!-- ヘッダー -->
  <header class="flex items-center justify-between px-4 py-3 bg-neutral-900/80 backdrop-blur-md border-b border-neutral-800 z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg">
        <i class="ph-bold ph-magic-wand text-lg text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-wider uppercase bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-300">ArtMorph Cam</h1>
        <p class="text-[10px] text-neutral-400">レトロ＆和風アート画像変換</p>
      </div>
    </div>
    
    <!-- モード切り替え・補助アクション -->
    <div class="flex items-center gap-2">
      <button id="btnSample" class="px-2.5 py-1 text-xs rounded-full bg-neutral-800 border border-neutral-700 text-neutral-300 hover:text-white flex items-center gap-1 active:scale-95 transition">
        <i class="ph ph-sparkle text-cyan-400"></i>
        <span>サンプル</span>
      </button>
      <label for="fileInput" class="px-2.5 py-1 text-xs rounded-full bg-neutral-800 border border-neutral-700 text-neutral-300 hover:text-white flex items-center gap-1 cursor-pointer active:scale-95 transition">
        <i class="ph ph-image"></i>
        <span>写真選択</span>
      </label>
      <input type="file" id="fileInput" accept="image/*" class="hidden">
    </div>
  </header>

  <!-- メインビューポート -->
  <main class="relative flex-1 flex items-center justify-center overflow-hidden bg-neutral-950">
    
    <!-- カメラライブストリーム (撮影前) -->
    <video id="cameraVideo" autoplay playsinline muted class="absolute w-full h-full object-cover transform -scale-x-100 hidden"></video>

    <!-- メインCanvas (加工・表示用) -->
    <div id="canvasContainer" class="relative max-w-full max-h-full flex items-center justify-center p-2">
      <canvas id="mainCanvas" class="rounded-xl shadow-2xl border border-neutral-800 max-h-[68vh] max-w-full object-contain"></canvas>
      
      <!-- 原本比較ホールドインジケーター (撮影/加工中のみ) -->
      <div id="compareBadge" class="absolute top-4 left-4 bg-black/60 backdrop-blur px-2.5 py-1 rounded-md text-[11px] text-cyan-300 border border-cyan-500/30 pointer-events-none hidden">
        長押しで原画と比較中
      </div>
    </div>

    <!-- カメラアクセス要求時 / 初期ローディングガイド -->
    <div id="initPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-neutral-950 p-6 text-center z-10">
      <div class="w-16 h-16 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center text-cyan-400 text-3xl animate-pulse">
        <i class="ph ph-camera"></i>
      </div>
      <h2 class="text-base font-semibold">カメラを起動または写真を選択</h2>
      <p class="text-xs text-neutral-400 max-w-xs">自撮りカメラで顔を撮影するか、端末の写真フォルダから画像を選んで特殊エフェクトをかけましょう。</p>
      <div class="flex flex-col w-full max-w-xs gap-2.5 pt-2">
        <button id="btnStartCam" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-medium text-sm flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 active:scale-98 transition">
          <i class="ph-bold ph-camera text-base"></i>
          カメラを起動する
        </button>
        <button id="btnLoadSampleMain" class="w-full py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border border-neutral-700 text-xs flex items-center justify-center gap-2 transition">
          <i class="ph-bold ph-user text-sm"></i>
          サンプル顔写真で体験する
        </button>
      </div>
    </div>

    <!-- 撮影用オーバーレイコントロール (カメラ起動時) -->
    <div id="cameraControls" class="absolute bottom-4 left-0 right-0 flex items-center justify-around px-8 z-20 hidden">
      <button id="btnFlipCam" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur border border-neutral-700 flex items-center justify-center text-xl text-neutral-200 active:scale-90 transition">
        <i class="ph-bold ph-camera-rotate"></i>
      </button>
      <button id="btnShutter" class="w-20 h-20 rounded-full border-4 border-white bg-red-500 flex items-center justify-center shadow-lg active:scale-90 transition">
        <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center">
          <div class="w-14 h-14 rounded-full bg-red-500"></div>
        </div>
      </button>
      <button id="btnCancelCam" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur border border-neutral-700 flex items-center justify-center text-xl text-neutral-200 active:scale-90 transition">
        <i class="ph-bold ph-x"></i>
      </button>
    </div>
  </main>

  <!-- コントロール・フィルター選択パネル (加工時) -->
  <section id="editPanel" class="bg-neutral-900/95 backdrop-blur-md border-t border-neutral-800 flex flex-col gap-2 p-3 z-20">
    
    <!-- 調整スライダーセクション -->
    <div class="flex items-center gap-3 px-2 py-1 bg-neutral-950/70 rounded-lg border border-neutral-800">
      <span id="paramLabel" class="text-xs font-medium text-neutral-300 w-24 truncate">エフェクト強度</span>
      <input type="range" id="paramSlider" min="2" max="24" value="10" step="1" class="flex-1 h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer">
      <span id="paramValue" class="text-[11px] font-mono text-cyan-400 w-8 text-right">10</span>
    </div>

    <!-- フィルター一覧カルーセル -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
      <button class="filter-btn active flex-shrink-0 flex flex-col items-center justify-center w-18 px-3 py-2 rounded-xl bg-neutral-800 border border-neutral-700 text-xs transition" data-filter="pixel">
        <i class="ph-bold ph-squares-four text-base mb-1"></i>
        <span>ドット絵</span>
      </button>
      <button class="filter-btn flex-shrink-0 flex flex-col items-center justify-center w-18 px-3 py-2 rounded-xl bg-neutral-800 border border-neutral-700 text-xs transition" data-filter="ascii">
        <i class="ph-bold ph-terminal text-base mb-1"></i>
        <span>アスキー</span>
      </button>
      <button class="filter-btn flex-shrink-0 flex flex-col items-center justify-center w-18 px-3 py-2 rounded-xl bg-neutral-800 border border-neutral-700 text-xs transition" data-filter="manga">
        <i class="ph-bold ph-book-open text-base mb-1"></i>
        <span>漫画トーン</span>
      </button>
      <button class="filter-btn flex-shrink-0 flex flex-col items-center justify-center w-18 px-3 py-2 rounded-xl bg-neutral-800 border border-neutral-700 text-xs transition" data-filter="suiboku">
        <i class="ph-bold ph-paint-brush text-base mb-1"></i>
        <span>水墨画</span>
      </button>
      <button class="filter-btn flex-shrink-0 flex flex-col items-center justify-center w-18 px-3 py-2 rounded-xl bg-neutral-800 border border-neutral-700 text-xs transition" data-filter="popart">
        <i class="ph-bold ph-palette text-base mb-1"></i>
        <span>ポップ</span>
      </button>
    </div>

    <!-- ボトムボタングループ (再撮影・長押し比較・保存) -->
    <div class="flex items-center justify-between gap-2 pt-1 pb-safe">
      <button id="btnRetake" class="flex-1 py-2 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-xs font-medium flex items-center justify-center gap-1.5 active:scale-95 transition">
        <i class="ph-bold ph-arrow-counter-clockwise"></i>
        <span>再撮影</span>
      </button>
      
      <button id="btnHoldCompare" class="flex-1 py-2 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-xs font-medium flex items-center justify-center gap-1.5 active:bg-cyan-950 transition">
        <i class="ph-bold ph-eye"></i>
        <span>比較(押す)</span>
      </button>
      
      <button id="btnSave" class="flex-1 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-xs flex items-center justify-center gap-1.5 shadow-md shadow-cyan-600/30 active:scale-95 transition">
        <i class="ph-bold ph-download-simple"></i>
        <span>保存</span>
      </button>
    </div>
  </section>

  <!-- 通知トースト -->
  <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-neutral-800/90 backdrop-blur border border-neutral-700 text-xs text-white px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none z-50">
    メッセージ
  </div>

  <script>
    // === アプリケーション状態管理 ===
    const state = {
      stream: null,
      facingMode: 'user', // 'user' (インカメ) or 'environment' (アウトカメ)
      isCameraActive: false,
      currentFilter: 'pixel', // 'pixel', 'ascii', 'manga', 'suiboku', 'popart'
      filterParams: {
        pixel: { val: 10, min: 3, max: 28, step: 1, label: 'ドット粗さ' },
        ascii: { val: 8, min: 4, max: 16, step: 1, label: '文字密度' },
        manga: { val: 5, min: 2, max: 12, step: 1, label: 'トーン粒度' },
        suiboku: { val: 140, min: 70, max: 210, step: 5, label: '墨のにじみ' },
        popart: { val: 4, min: 2, max: 8, step: 1, label: '色階調数' }
      },
      sourceImage: null, // Image または offscreen canvas
      isComparing: false
    };

    // DOM要素
    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const initPlaceholder = document.getElementById('initPlaceholder');
    const cameraControls = document.getElementById('cameraControls');
    const editPanel = document.getElementById('editPanel');
    const paramSlider = document.getElementById('paramSlider');
    const paramLabel = document.getElementById('paramLabel');
    const paramValue = document.getElementById('paramValue');
    const compareBadge = document.getElementById('compareBadge');
    const toast = document.getElementById('toast');

    // トースト通知関数
    function showToast(text) {
      toast.textContent = text;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2200);
    }

    // === カメラストリーム制御 ===
    async function startCamera() {
      stopCamera();
      initPlaceholder.classList.add('hidden');
      video.classList.remove('hidden');
      cameraControls.classList.remove('hidden');
      editPanel.classList.add('hidden');

      // インカメラ時は左右反転
      if (state.facingMode === 'user') {
        video.classList.add('-scale-x-100');
      } else {
        video.classList.remove('-scale-x-100');
      }

      try {
        const constraints = {
          video: {
            facingMode: state.facingMode,
            width: { ideal: 1080 },
            height: { ideal: 1440 }
          },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        state.stream = stream;
        video.srcObject = stream;
        state.isCameraActive = true;
      } catch (err) {
        console.warn('カメラアクセスエラー:', err);
        showToast('カメラを起動できませんでした。サンプルを使用します。');
        stopCamera();
        loadSamplePortrait();
      }
    }

    function stopCamera() {
      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
        state.stream = null;
      }
      state.isCameraActive = false;
      video.classList.add('hidden');
      cameraControls.classList.add('hidden');
    }

    // カメラのシャッター撮影
    function captureFrame() {
      if (!state.isCameraActive) return;

      const vW = video.videoWidth || 720;
      const vH = video.videoHeight || 960;
      
      // 正方形やポートレートに近いアスペクト比でトリミングまたはそのまま取り込み
      const offCanvas = document.createElement('canvas');
      offCanvas.width = vW;
      offCanvas.height = vH;
      const offCtx = offCanvas.getContext('2d');

      if (state.facingMode === 'user') {
        // 自撮りはミラー反転させて保存
        offCtx.translate(vW, 0);
        offCtx.scale(-1, 1);
      }
      offCtx.drawImage(video, 0, 0, vW, vH);

      const capturedImg = new Image();
      capturedImg.onload = () => {
        state.sourceImage = capturedImg;
        stopCamera();
        editPanel.classList.remove('hidden');
        renderEffect();
      };
      capturedImg.src = offCanvas.toDataURL('image/jpeg', 0.95);
    }

    // === サンプル画像の生成 (Canvasによる自撮り風ポートレート) ===
    function loadSamplePortrait() {
      stopCamera();
      initPlaceholder.classList.add('hidden');
      editPanel.classList.remove('hidden');

      const sCanvas = document.createElement('canvas');
      sCanvas.width = 640;
      sCanvas.height = 800;
      const sCtx = sCanvas.getContext('2d');

      // 背景グラデーション
      const bg = sCtx.createLinearGradient(0, 0, 640, 800);
      bg.addColorStop(0, '#3b82f6');
      bg.addColorStop(0.5, '#6366f1');
      bg.addColorStop(1, '#1e1b4b');
      sCtx.fillStyle = bg;
      sCtx.fillRect(0, 0, 640, 800);

      // 人物の髪・頭・顔・服を描画
      // 体
      sCtx.fillStyle = '#1e293b';
      sCtx.beginPath();
      sCtx.ellipse(320, 750, 240, 180, 0, 0, Math.PI * 2);
      sCtx.fill();

      // 首
      sCtx.fillStyle = '#fbcfe8';
      sCtx.fillRect(280, 480, 80, 100);

      // 顔輪郭
      sCtx.fillStyle = '#fde047';
      const skinGrad = sCtx.createLinearGradient(200, 200, 440, 520);
      skinGrad.addColorStop(0, '#fef08a');
      skinGrad.addColorStop(1, '#fcd34d');
      sCtx.fillStyle = skinGrad;
      sCtx.beginPath();
      sCtx.ellipse(320, 360, 130, 160, 0, 0, Math.PI * 2);
      sCtx.fill();

      // 髪
      sCtx.fillStyle = '#18181b';
      sCtx.beginPath();
      sCtx.arc(320, 310, 145, Math.PI * 0.85, Math.PI * 2.15);
      sCtx.fill();
      sCtx.beginPath();
      sCtx.ellipse(200, 350, 40, 100, 0.2, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.beginPath();
      sCtx.ellipse(440, 350, 40, 100, -0.2, 0, Math.PI * 2);
      sCtx.fill();

      // 目
      sCtx.fillStyle = '#18181b';
      sCtx.beginPath();
      sCtx.arc(270, 360, 12, 0, Math.PI * 2);
      sCtx.arc(370, 360, 12, 0, Math.PI * 2);
      sCtx.fill();

      // 目のハイライト
      sCtx.fillStyle = '#ffffff';
      sCtx.beginPath();
      sCtx.arc(273, 356, 4, 0, Math.PI * 2);
      sCtx.arc(373, 356, 4, 0, Math.PI * 2);
      sCtx.fill();

      // 鼻
      sCtx.strokeStyle = '#d97706';
      sCtx.lineWidth = 3;
      sCtx.beginPath();
      sCtx.moveTo(320, 375);
      sCtx.lineTo(315, 400);
      sCtx.lineTo(325, 403);
      sCtx.stroke();

      // 笑顔口元
      sCtx.strokeStyle = '#dc2626';
      sCtx.lineWidth = 4;
      sCtx.beginPath();
      sCtx.arc(320, 430, 28, 0.15 * Math.PI, 0.85 * Math.PI);
      sCtx.stroke();

      // 頬の赤み
      sCtx.fillStyle = 'rgba(244, 63, 94, 0.35)';
      sCtx.beginPath();
      sCtx.ellipse(250, 400, 25, 15, 0, 0, Math.PI * 2);
      sCtx.ellipse(390, 400, 25, 15, 0, 0, Math.PI * 2);
      sCtx.fill();

      const img = new Image();
      img.onload = () => {
        state.sourceImage = img;
        renderEffect();
        showToast('サンプル顔写真を読み込みました');
      };
      img.src = sCanvas.toDataURL();
    }

    // === 画像ファイルアップロード対応 ===
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          stopCamera();
          initPlaceholder.classList.add('hidden');
          editPanel.classList.remove('hidden');
          state.sourceImage = img;
          renderEffect();
          showToast('画像を読み込みました');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = ''; // リセット
    }

    // === エフェクト描画パイプライン ===
    function renderEffect() {
      if (!state.sourceImage) return;

      const img = state.sourceImage;
      
      // 処理負荷軽減と画面フィットのため最大幅800pxにリサイズ
      const maxDim = 800;
      let targetW = img.width;
      let targetH = img.height;
      if (targetW > maxDim || targetH > maxDim) {
        if (targetW > targetH) {
          targetH = Math.round((targetH * maxDim) / targetW);
          targetW = maxDim;
        } else {
          targetW = Math.round((targetW * maxDim) / targetH);
          targetH = maxDim;
        }
      }

      canvas.width = targetW;
      canvas.height = targetH;

      // 比較モード中なら元画像をそのまま表示
      if (state.isComparing) {
        ctx.drawImage(img, 0, 0, targetW, targetH);
        return;
      }

      // オフスクリーンCanvasで元画像ピクセルを取得
      const workCanvas = document.createElement('canvas');
      workCanvas.width = targetW;
      workCanvas.height = targetH;
      const workCtx = workCanvas.getContext('2d');
      workCtx.drawImage(img, 0, 0, targetW, targetH);
      const imgData = workCtx.getImageData(0, 0, targetW, targetH);
      const pixels = imgData.data;

      const param = state.filterParams[state.currentFilter].val;

      switch (state.currentFilter) {
        case 'pixel':
          applyPixelArt(ctx, pixels, targetW, targetH, param);
          break;
        case 'ascii':
          applyAsciiArt(ctx, pixels, targetW, targetH, param);
          break;
        case 'manga':
          applyMangaTone(ctx, pixels, targetW, targetH, param);
          break;
        case 'suiboku':
          applySuibokuga(ctx, pixels, targetW, targetH, param);
          break;
        case 'popart':
          applyPopArt(ctx, pixels, targetW, targetH, param);
          break;
      }
    }

    // 1. ドット絵 (Pixel Art with Retro Dither / Quantization)
    function applyPixelArt(context, pixels, width, height, blockSize) {
      context.fillStyle = '#111';
      context.fillRect(0, 0, width, height);

      // レトロパレットの量子化
      for (let y = 0; y < height; y += blockSize) {
        for (let x = 0; x < width; x += blockSize) {
          // ブロック中心または平均の色を取得
          let r = 0, g = 0, b = 0, count = 0;
          for (let dy = 0; dy < blockSize && (y + dy) < height; dy += 2) {
            for (let dx = 0; dx < blockSize && (x + dx) < width; dx += 2) {
              const idx = ((y + dy) * width + (x + dx)) * 4;
              r += pixels[idx];
              g += pixels[idx + 1];
              b += pixels[idx + 2];
              count++;
            }
          }
          r = Math.floor(r / count);
          g = Math.floor(g / count);
          b = Math.floor(b / count);

          // 8ビット風に色数を丸める（ポスタリゼーション）
          const step = 64;
          r = Math.min(255, Math.floor((r + step / 2) / step) * step);
          g = Math.min(255, Math.floor((g + step / 2) / step) * step);
          b = Math.min(255, Math.floor((b + step / 2) / step) * step);

          context.fillStyle = `rgb(${r},${g},${b})`;
          context.fillRect(x, y, blockSize, blockSize);

          // わずかにドットグリッドの陰影をつける
          if (blockSize >= 8) {
            context.fillStyle = 'rgba(0,0,0,0.12)';
            context.fillRect(x + blockSize - 1, y, 1, blockSize);
            context.fillRect(x, y + blockSize - 1, blockSize, 1);
          }
        }
      }
    }

    // 2. アスキーアート (ASCII Art Overlay)
    function applyAsciiArt(context, pixels, width, height, fontSize) {
      context.fillStyle = '#080808';
      context.fillRect(0, 0, width, height);

      // 輝度マッピング用文字列表
      const chars = " .'`^\",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
      context.font = `bold ${fontSize}px monospace`;
      context.textAlign = 'center';
      context.textBaseline = 'middle';

      const stepX = fontSize * 0.62;
      const stepY = fontSize;

      for (let y = stepY / 2; y < height; y += stepY) {
        for (let x = stepX / 2; x < width; x += stepX) {
          const px = Math.min(width - 1, Math.floor(x));
          const py = Math.min(height - 1, Math.floor(y));
          const idx = (py * width + px) * 4;
          
          const r = pixels[idx];
          const g = pixels[idx + 1];
          const b = pixels[idx + 2];
          // 輝度
          const brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const charIndex = Math.floor(brightness * (chars.length - 1));
          const char = chars[charIndex];

          // サイバーグリーンや発光カラー
          context.fillStyle = `rgb(${Math.min(255, r + 40)}, ${Math.min(255, g + 60)}, ${Math.min(255, b + 40)})`;
          context.fillText(char, x, y);
        }
      }
    }

    // 3. 漫画風トーン (Manga Screen Tone & Edge lines)
    function applyMangaTone(context, pixels, width, height, toneRadius) {
      // 白背景
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, width, height);

      // ハーフトーンドットと高コントラスト輪郭
      const step = toneRadius * 2;
      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const px = Math.min(width - 1, x);
          const py = Math.min(height - 1, y);
          const idx = (py * width + px) * 4;

          const lum = (pixels[idx] * 0.299 + pixels[idx + 1] * 0.587 + pixels[idx + 2] * 0.114);

          // 完全な白ハイライト領域
          if (lum > 225) continue;

          // 墨ベタ（黒塗り）領域
          if (lum < 55) {
            context.fillStyle = '#111111';
            context.fillRect(x, y, step, step);
            continue;
          }

          // スクリーントーン領域（輝度に応じた円の半径）
          const fraction = 1 - (lum / 255);
          const radius = (step / 2) * fraction * 1.35;

          context.fillStyle = '#181818';
          context.beginPath();
          context.arc(x + step / 2, y + step / 2, Math.max(1, radius), 0, Math.PI * 2);
          context.fill();
        }
      }

      // マンガのコマ枠効果（外枠）
      context.lineWidth = 8;
      context.strokeStyle = '#111111';
      context.strokeRect(6, 6, width - 12, height - 12);
    }

    // 4. 水墨画風 (Sumi-e / Ink Wash Style with Seal Stamp)
    function applySuibokuga(context, pixels, width, height, threshold) {
      // 和紙（宣紙）の生成と下地
      context.fillStyle = '#f6f3eb';
      context.fillRect(0, 0, width, height);

      // 和紙の微小なノイズ感
      context.fillStyle = 'rgba(120, 110, 95, 0.04)';
      for (let i = 0; i < width; i += 4) {
        for (let j = 0; j < height; j += 4) {
          if (Math.random() > 0.6) {
            context.fillRect(i, j, 2, 2);
          }
        }
      }

      // 濃淡墨のレンダリング
      const imgDataOut = context.getImageData(0, 0, width, height);
      const outData = imgDataOut.data;

      for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];
        const gray = 0.299 * r + 0.587 * g + 0.114 * b;

        // 水墨の濃淡グラデーション
        let ink = 255;
        if (gray < threshold * 0.4) {
          // 濃墨 (濃い黒)
          ink = 25;
        } else if (gray < threshold) {
          // 破墨・淡墨 (薄墨のグラデーション)
          const ratio = (gray - threshold * 0.4) / (threshold * 0.6);
          ink = 45 + Math.floor(ratio * 120);
        } else if (gray < threshold * 1.3) {
          // かすれ淡墨
          ink = 180 + Math.floor((gray - threshold) * 0.8);
        } else {
          // 余白（和紙色を透過維持）
          continue;
        }

        // 和紙色と墨色のブレンド
        const alpha = (255 - ink) / 255;
        outData[i] = Math.floor(outData[i] * (1 - alpha) + ink * alpha);
        outData[i + 1] = Math.floor(outData[i + 1] * (1 - alpha) + (ink + 2) * alpha);
        outData[i + 2] = Math.floor(outData[i + 2] * (1 - alpha) + (ink + 4) * alpha);
      }
      context.putImageData(imgDataOut, 0, 0);

      // 右下に落款印（朱肉の角印）を押印
      const stampSize = Math.max(38, Math.min(64, Math.floor(width * 0.1)));
      const stampX = width - stampSize - 18;
      const stampY = height - stampSize - 22;

      // 朱色枠
      context.save();
      context.strokeStyle = '#c82828';
      context.lineWidth = 3;
      context.fillStyle = 'rgba(215, 45, 45, 0.85)';
      context.strokeRect(stampX, stampY, stampSize, stampSize);

      // 押印の漢字「墨芸」または「印」
      context.fillStyle = '#ffffff';
      context.font = `bold ${Math.floor(stampSize * 0.42)}px serif`;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText('墨', stampX + stampSize * 0.5, stampY + stampSize * 0.35);
      context.fillText('印', stampX + stampSize * 0.5, stampY + stampSize * 0.72);
      context.restore();
    }

    // 5. ポップアート (Pop Art Posterization)
    function applyPopArt(context, pixels, width, height, levels) {
      const palette = [
        [244, 63, 94],   // ネオンローズ
        [251, 191, 36],  // サンフラワー
        [56, 189, 248],  // シアンブルー
        [168, 85, 247],  // パープル
        [16, 185, 129],  // エメラルド
        [24, 24, 27]     // ブラック
      ];

      const imgDataOut = context.createImageData(width, height);
      const out = imgDataOut.data;

      const step = 255 / levels;

      for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];
        const gray = 0.299 * r + 0.587 * g + 0.114 * b;

        const colorIdx = Math.min(palette.length - 1, Math.floor((gray / 255) * palette.length));
        const color = palette[colorIdx];

        out[i] = color[0];
        out[i + 1] = color[1];
        out[i + 2] = color[2];
        out[i + 3] = 255;
      }

      context.putImageData(imgDataOut, 0, 0);
    }

    // === UIイベントリスナー群 ===
    // フィルターボタン選択
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.currentFilter = btn.dataset.filter;

        // スライダーの範囲・ラベルを更新
        const p = state.filterParams[state.currentFilter];
        paramLabel.textContent = p.label;
        paramSlider.min = p.min;
        paramSlider.max = p.max;
        paramSlider.step = p.step;
        paramSlider.value = p.val;
        paramValue.textContent = p.val;

        renderEffect();
      });
    });

    // パラメータスライダー変更
    paramSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      state.filterParams[state.currentFilter].val = val;
      paramValue.textContent = val;
      renderEffect();
    });

    // カメラ起動
    document.getElementById('btnStartCam').addEventListener('click', () => {
      startCamera();
    });

    // サンプル写真呼び出し
    document.getElementById('btnSample').addEventListener('click', loadSamplePortrait);
    document.getElementById('btnLoadSampleMain').addEventListener('click', loadSamplePortrait);

    // カメラ切り替え (インカメ / アウトカメ)
    document.getElementById('btnFlipCam').addEventListener('click', () => {
      state.facingMode = (state.facingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // シャッター
    document.getElementById('btnShutter').addEventListener('click', captureFrame);

    // カメラキャンセル
    document.getElementById('btnCancelCam').addEventListener('click', () => {
      stopCamera();
      if (state.sourceImage) {
        editPanel.classList.remove('hidden');
        renderEffect();
      } else {
        initPlaceholder.classList.remove('hidden');
      }
    });

    // 再撮影ボタン
    document.getElementById('btnRetake').addEventListener('click', () => {
      startCamera();
    });

    // 原本比較（長押し/タップホールド）
    const btnHoldCompare = document.getElementById('btnHoldCompare');
    function startCompare(e) {
      if (e) e.preventDefault();
      state.isComparing = true;
      compareBadge.classList.remove('hidden');
      renderEffect();
    }
    function endCompare(e) {
      if (e) e.preventDefault();
      state.isComparing = false;
      compareBadge.classList.add('hidden');
      renderEffect();
    }
    btnHoldCompare.addEventListener('mousedown', startCompare);
    btnHoldCompare.addEventListener('mouseup', endCompare);
    btnHoldCompare.addEventListener('mouseleave', endCompare);
    btnHoldCompare.addEventListener('touchstart', startCompare, { passive: false });
    btnHoldCompare.addEventListener('touchend', endCompare, { passive: false });
    btnHoldCompare.addEventListener('touchcancel', endCompare, { passive: false });

    // ファイルアップロード
    document.getElementById('fileInput').addEventListener('change', handleFileUpload);

    // ダウンロード・保存
    document.getElementById('btnSave').addEventListener('click', () => {
      if (!canvas) return;
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `artmorph_${state.currentFilter}_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('画像を端末に保存しました！');
    });

    // 初期起動時：サンプル画像を読み込んでプレビュー表示
    window.addEventListener('load', () => {
      loadSamplePortrait();
    });
  </script>
</body>
</html>
